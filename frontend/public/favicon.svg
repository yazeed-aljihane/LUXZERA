<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- White card background with rounded corners -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#ffffff"/>
  
  <!-- L and Z shapes -->
  <g transform="translate(5, 10)">
    <!-- L: Orange, thick, rounded, slanted -->
    <path d="M 180 135 
             C 170 190, 150 270, 140 310 
             C 135 335, 155 342, 175 338 
             C 195 334, 210 328, 220 324" 
          fill="none" 
          stroke="#FF5500" 
          stroke-width="74" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Z: Navy, thick, rounded, slanted -->
    <path d="M 305 185 
             C 325 180, 355 170, 385 162 
             C 365 205, 325 275, 295 315 
             C 325 305, 355 295, 385 285" 
          fill="none" 
          stroke="#07162c" 
          stroke-width="74" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
